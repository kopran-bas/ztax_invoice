# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: ztaxinvoice
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: BAS_CONNECT_NEW
          url: https://my430786.s4hana.cloud.sap
          scp: true
          authenticationType: reentranceTicket # SAML support for vscode
        app:
          name: ZTAX_INVOICE
          package: ZSD_TAX_INVOICE
          transport: D0OK901093
        exclude:
          - /test/
